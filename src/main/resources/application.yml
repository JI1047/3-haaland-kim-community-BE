spring:
  datasource:
    # 1. 주소를 로컬로 변경 (DBeaver에서 확인한 주소)
    url: jdbc:mysql://localhost:3306/community?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    # 2. 계정 정보 (DBeaver와 동일하게)
    username: root
    # 3. 아까 설정한 비밀번호 (비밀번호 없이 들어갔다면 빈값 "" 혹은 설정한 비번)
    password: rlawltjr123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    time-zone: Asia/Seoul

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        use_sql_comments: true

  session:
    store-type: none   # ✅ 세션 저장소 완전 비활성화

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    session:
      timeout: 0          # ✅ 세션 즉시 만료
      persistent: false   # ✅ 세션 저장하지 않음
      tracking-modes: cookie  # ✅ URL 세션 트래킹도 비활성화

file:
  upload-dir: uploads

cors:
  allowed-origins: "https://haaland-community.site,https://www.haaland-community.site,http://localhost:3000"

management:
  endpoints:
    web:
      exposure:
        include: "*"
app:
  frontend-url: http://localhost:3000