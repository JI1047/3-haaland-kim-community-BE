name: BE CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Test (Gradle)
        run: ./gradlew test

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/board-be:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/board-be:latest

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH Key for NAT
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa     # NAT 접속용 SSH 키
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.NAT_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Private BE Instance via NAT
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@${{ secrets.NAT_HOST }} \
          "ssh -i /home/ubuntu/KTB_Cloud.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.PRIVATE_BE_IP }} \
          '
          echo \"Stopping previous backend container...\";
          sudo docker stop backend || true;
          sudo docker rm backend || true;

          echo \"Pulling latest backend image...\";
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/board-be:latest;

          echo \"Running new backend container...\";
          sudo docker run -d \
            --name backend \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -v /home/ubuntu/app/application-prod.yml:/config/application-prod.yml \
            ${{ secrets.DOCKER_USERNAME }}/board-be:latest;
          '"
