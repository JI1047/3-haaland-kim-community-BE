name: BE CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Test (Gradle)
        run: ./gradlew test

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/board-be:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/board-be:latest


  deploy:
    needs: build-and-push-image
    runs-on: self-hosted   # 🔥 여기 중요!! 이제 이 Job은 BE 서버에서 실행됨

    steps:
      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/board-be:latest

      - name: Stop previous container
        run: docker stop backend || true

      - name: Remove previous container
        run: docker rm backend || true

      - name: Run new container
        run: |
          docker run -d \
            --name backend \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -v /home/ubuntu/app/application-prod.yml:/config/application-prod.yml \
            ${{ secrets.DOCKER_USERNAME }}/board-be:latest
