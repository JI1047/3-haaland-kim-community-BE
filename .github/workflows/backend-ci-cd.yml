name: BE CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 최신 v4 사용

      - name: Set up JDK 21
        uses: actions/setup-java@v4 # 최신 v4 사용
        with:
          distribution: 'temurin'
          java-version: '21'
          # [핵심 1] Gradle 캐싱 활성화 (라이브러리 다운로드 시간 삭제)
          cache: 'gradle'

      # [핵심 2] Docker Layer 캐싱을 위한 Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # Test와 Build를 하나로 합쳐서 실행 속도 최적화
      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon --parallel

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # [핵심 3] 빌드 푸시 액션을 사용하여 레이어 캐싱 적용
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKER_USERNAME }}/board-be:latest
          # GitHub Actions 자체 캐시를 사용하여 jlink 등 무거운 레이어 저장
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push-image
    runs-on: self-hosted
    steps:
      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/board-be:latest

      - name: Stop and Remove previous container
        run: |
          docker stop backend || true
          docker rm backend || true

      - name: Cleanup old images
        run: docker image prune -f

      - name: Run new container
        run: |
          docker run -d \
            --name backend \
            -p 8080:8080 \
            ${{ secrets.DOCKER_USERNAME }}/board-be:latest